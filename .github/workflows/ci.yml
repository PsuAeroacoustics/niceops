name: Build and Test

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Report both configurations even when one fails; which one broke is the
      # useful part.
      fail-fast: false
      matrix:
        include:
          # The default build.  Plotting embeds Python, and the first configure
          # creates a virtual environment and pip-installs matplotlib into it.
          # python3-venv provides both `python3 -m venv` and the ensurepip that
          # populates it; on Debian and Ubuntu it is packaged separately from
          # python3 itself, so without it the venv step fails.
          - name: with plotting
            packages: libnetcdf-dev python3-dev python3-venv
            options: ""
          # The minimal build: netCDF and nothing else.  Nothing else compiles
          # plotting_disabled.cpp, so without this job it rots silently the
          # first time a plt:: entry point is added.
          - name: without plotting
            packages: libnetcdf-dev
            options: -DNICEOPS_PLOTTING=OFF

    name: ${{ matrix.name }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      # apt-get update first: a runner image's package lists go stale between
      # rebuilds often enough that a bare install 404s.
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE ${{ matrix.options }}

    - name: Build
      run: cmake --build build --config $BUILD_TYPE -j$(nproc)

    - name: Check the plotting environment
      # CMake only warns when the venv or the matplotlib install fails, so that
      # a missing network doesn't block a build that never plots.  CI is the one
      # place that should be strict about it: without this, the job stays green
      # while quietly falling back to the system interpreter, and the bundled
      # environment is never actually tested.
      if: matrix.options == ''
      run: build/pyenv/bin/python -c "import matplotlib; print(matplotlib.__version__)"

    - name: Test
      # --output-on-failure rather than -V: the suite runs ~46k assertions and
      # 1.8M self-test samples, and the passing ones are noise.
      run: ctest --test-dir build -C $BUILD_TYPE --output-on-failure

    - name: Draw the figures
      # No CTest case passes -p/-f/-F, so the plotting path is compiled but
      # never executed.  That is how plotting.cpp shipped missing a pybind11
      # include: it built clean and threw cast_error on every call.  Run the
      # demo once for real output and confirm the files landed.
      #
      # After the tests, not before: this rewrites integrated/197421_LAE.csv,
      # which regression_golden compares.
      if: matrix.options == ''
      run: |
        mkdir -p ci-figures
        build/niceops -f ci-figures/footprint.png -F ci-figures/state.png
        test -s ci-figures/footprint.png
        test -s ci-figures/state_CT_.png

    - name: Show the log on failure
      # fatal() writes its reason to log/niceops.log and calls abort(), so a
      # failed run prints nothing at all to stdout or stderr -- ctest reports
      # only "Subprocess aborted" and an empty output block. Surface the log
      # inline so a red build says why without downloading the artifact.
      if: failure()
      run: |
        echo "--- last 40 lines of log/niceops.log ---"
        tail -40 log/niceops.log || echo "(no log written)"
        echo "--- any fatal or error lines ---"
        grep -E '\[(fatal|error)\]' log/niceops.log || echo "(none)"

    - name: Upload log
      # Named per job: upload-artifact v4 refuses two uploads under one name.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: log-${{ matrix.options == '' && 'plotting' || 'minimal' }}
        path: log/
        if-no-files-found: ignore
