name: Build and Test

on:
  push:
  pull_request:
  # By hand, from the Actions tab: `full` runs the extended tests too.
  workflow_dispatch:
    inputs:
      full:
        description: Run the whole suite, extended tests included
        type: boolean
        default: false

# A branch in this repo with a PR open fires both events, so every commit built
# twice -- four jobs with the matrix, and the pull_request pair was an exact
# rerun of the push pair on the same SHA.
#
# The push run is the one to keep: it covers branches with no PR open yet, which
# is how this repo is usually worked, and its checks still show on the PR. That
# leaves the pull_request run for the one case a push event cannot see at all --
# a PR opened from a fork, whose commits never land in this repo.
concurrency:
  # Supersede rather than pile up: pushing a fixup while the previous build is
  # still going should cancel it. Never cancel on master, where each run is the
  # record for a commit that is already merged.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    # Skip the duplicate: same-repo PRs are already covered by their push run.
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # One configuration, with plotting.  A second job without plotting used to run the whole suite
    # again for the sake of plotting_disabled.cpp, which nothing else compiles; the plotting build
    # now compiles it too and plotting_stub_is_complete holds it to plotting.cpp's entry points.
    name: build and test

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      # apt-get update first: a runner image's package lists go stale between
      # rebuilds often enough that a bare install 404s.
      #
      # Plotting embeds Python, and the first configure creates a virtual
      # environment and pip-installs matplotlib into it.  python3-venv provides
      # both `python3 -m venv` and the ensurepip that populates it; on Debian and
      # Ubuntu it is packaged separately from python3 itself, so without it the
      # venv step fails.
      run: |
        sudo apt-get update
        sudo apt-get install -y libnetcdf-dev python3-dev python3-venv ccache

    - name: Restore the compiler cache
      # Keyed by commit, restored from the newest: a push that touches a few
      # sources recompiles those and takes the rest from the cache.
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-

    - name: Configure
      # The compiler and its target first: the image's GCC may default past
      # baseline x86-64 (Ubuntu's amd64v3 builds take x86-64-v3, with FMA),
      # which is what -ffp-contract=on in CMakeLists.txt is about.
      run: >-
        c++ --version | head -1 && c++ -Q --help=target | grep -E -- '-march=|-mfma ' ;
        cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DNICEOPS_ASSERTS=ON
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

    - name: Build
      run: |
        cmake --build build --config $BUILD_TYPE -j$(nproc)
        ccache --show-stats

    - name: Save the compiler cache
      # Before the tests, so that a red run still leaves its cache (actions/cache
      # saves only when the whole job succeeds).
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}

    - name: Check the plotting environment
      # CMake only warns when the venv or the matplotlib install fails, so that
      # a missing network doesn't block a build that never plots.  CI is the one
      # place that should be strict about it: without this, the job stays green
      # while quietly falling back to the system interpreter, and the bundled
      # environment is never actually tested.
      run: build/pyenv/bin/python -c "import matplotlib; print(matplotlib.__version__)"

    - name: Test
      # --output-on-failure rather than -V: the suite runs tens of thousands of
      # assertions and 1.8M self-test samples, and the passing ones are noise.
      # In parallel: every comparison is tied to the runs it reads by a fixture
      # (docs/internals/testing.md), and the serial suite took over half an hour.
      # The extended tests (tests/extended.cmake) are left out: CI is for
      # catching regressions, and a run by hand with `full` takes them all.
      env:
        LABEL_FILTER: ${{ inputs.full && ' ' || '-LE extended' }}
      run: ctest --test-dir build -C $BUILD_TYPE --output-on-failure -j$(nproc) $LABEL_FILTER

    - name: Draw the figures
      # No CTest case passes -p/-f/-F, so the plotting path is compiled but
      # never executed.  That is how plotting.cpp shipped missing a pybind11
      # include: it built clean and threw cast_error on every call.  Run the
      # demo once for real output and confirm the files landed.
      #
      # After the tests, not before: this rewrites integrated/197421_LAE.csv,
      # which regression_golden compares.
      run: |
        mkdir -p ci-figures
        build/niceops -f ci-figures/footprint.png -F ci-figures/state.png
        test -s ci-figures/footprint.png
        test -s ci-figures/state_CT_.png

    - name: Show the log on failure
      # fatal() writes its reason to log/niceops.log and calls abort(), so a
      # failed run prints nothing at all to stdout or stderr -- ctest reports
      # only "Subprocess aborted" and an empty output block. Surface the log
      # inline so a red build says why without downloading the artifact.  The
      # tests run in parallel, so their lines interleave; grep for the reason.
      if: failure()
      run: |
        echo "--- last 40 lines of log/niceops.log ---"
        tail -40 log/niceops.log || echo "(no log written)"
        echo "--- any fatal or error lines ---"
        grep -E '\[(fatal|error)\]' log/niceops.log || echo "(none)"

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: log
        path: log/
        if-no-files-found: ignore
